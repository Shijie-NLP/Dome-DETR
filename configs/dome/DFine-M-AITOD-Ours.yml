# D-FINE-M on AI-TOD-v2 with our method switched on: DFine-S-AITOD-Ours at the M scale, i.e.
# DFine-M-AITOD plus include/ours.yml and the per-image query budget (the rule and the grouped
# batches are explained in DFine-S-AITOD-Ours.yml). The B2 stem map is 48 channels wide.

__include__: [
  './DFine-M-AITOD.yml',
  './include/ours.yml',
]

output_dir: ./outputs/dfine_m_aitod_ours

HybridEncoder:
  fine_in_channels: 48

DFINETransformer:
  # the budget: the tokens the encoder scores above 0.4, plus a margin of 200 for the duplicates
  # and background candidates the matching needs, rounded up to 100, 300 at least and 1500 at
  # most; in training the ground-truth count stands in for the token count
  query_budget: threshold
  count_threshold: 0.4
  count_margin: 200
  count_round: 100
  count_range: [300, 1500]
  count_train_budget: gt

train_dataloader:
  # the batches grouped by object count in the budget's steps of 100, so a batch pads nothing
  group_by_count: {edges: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300]}
