# Dome-DETR-S on VisDrone2019-DET (README: 35.9 AP, 13.2M parameters).

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
]

output_dir: ./outputs/dome_s_visdrone

DOME:
  encoder: DomeHybridEncoder
  decoder: DomeTransformer

HGNetv2:
  name: 'B0'
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DomeHybridEncoder:
  in_channels: [64, 256, 512, 1024]
  depth_mult: .34
  expansion: 0.5

DomeTransformer:
  num_layers: 3
  # DeFE query budget per image
  min_num_select: 250
  max_num_select: 500


optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065

lr_scheduler:
  type: MultiStepLR
  milestones: [80, 120]
  gamma: 0.8


# 160 epochs; augmentation and multi-scale training stop at 150 and the last 10 epochs
# train on clean images
epoches: 160
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 150
  collate_fn:
    stop_epoch: 150

# Validation keeps the shared aspect-preserving protocol (1333x800), padded to a multiple of 80
# rather than 32 so that the stride-8 map tiles into whole MWAS windows (mwas_window_size 10).
# The released checkpoints were trained and evaluated on images squashed to 800x800 (README
# 35.9; 35.8 under that protocol here, 33.6 under this one), but a model trained with this
# recipe (aspect-preserving resize and 800x800 crops) must be validated the same way: at epoch
# 59 the same checkpoint scored 33.1 here and 23.8 under the squashed protocol.
val_dataloader:
  collate_fn:
    pad_to_multiple: 80
