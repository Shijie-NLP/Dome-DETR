# D-FINE-S baseline on AI-TOD-v2: the plain HybridEncoder and the D-FINE decoder at the S scale
# (include/scale_s.yml) on the shared 160-epoch recipe. 300 queries, D-FINE's fixed top-k; the tiles
# reach 2667 objects and the evaluator keeps 1500 detections per image, which the per-image
# budget of the Ours config is for.

__include__: [
  '../dataset/aitod_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
  './include/scale_s.yml',
  './include/recipe_160.yml',
]

output_dir: ./outputs/dfine_s_aitod

# the test split is 14k tiles scored at up to 1500 detections each, a validation costs 40% of an
# epoch. Stage 1 is validated every 10 epochs only: the legacy runs' stage-1 AP rises monotonically
# within 0.001, so best_stg1 is the last stage-1 epoch (119, a multiple of 10 minus one) whatever
# the density of the validations in between; stage 2 (from 120) is validated every epoch anyway
eval_freq: 10
eval_after: 120

DOME:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 300
