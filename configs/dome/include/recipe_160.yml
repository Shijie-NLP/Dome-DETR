# The training recipe of every D-FINE run here, whatever the scale or dataset: 160 epochs at
# batch 8, AdamW with the backbone at a tenth of the rate, two decays of 0.8, and the last 10
# epochs on clean images (augmentation and multi-scale off from epoch 150; stage 2 starts there).
# Overrides the defaults of optimizer.yml and the datasets' stop_epoch.

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065

lr_scheduler:
  type: MultiStepLR
  milestones: [80, 120]
  gamma: 0.8

epoches: 160
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 150
  collate_fn:
    stop_epoch: 150
