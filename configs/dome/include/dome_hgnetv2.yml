# Dome-DETR on an HGNetv2 backbone: the architecture shared by every Dome-{S,M,L} config and
# the D-FINE baselines. The model configs set what depends on the backbone size (HGNetv2 name,
# encoder in_channels, depth_mult / expansion, decoder num_layers), the dataset (DeFE query
# budget), and, deliberately, which encoder and decoder DOME is built from:
#
#   DOME: {encoder: DomeHybridEncoder, decoder: DomeTransformer}   # Dome-DETR
#   DOME: {encoder: HybridEncoder,     decoder: DFINETransformer}  # D-FINE baseline
#
# There is no default here: a config that does not say fails at model construction.

task: detection

model: DOME
criterion: DomeCriterion
postprocessor: DomePostProcessor

use_focal_loss: True
# eval_spatial_size is left unset: validation images keep their aspect ratio, so the encoder builds
# its position embeddings for whatever size arrives instead of caching them for one fixed size

DOME:
  backbone: HGNetv2

HGNetv2:
  pretrained: True
  local_model_dir: weight/hgnetv2/

# four feature levels, strides 4 to 32: the stride-4 level is what makes tiny objects reachable.
# HybridEncoder is the D-FINE baseline encoder; DomeHybridEncoder merges its settings (the yaml
# anchor) and adds DeFE / MWAS. A model config picks one with `DOME: {encoder: ...}`.
HybridEncoder: &hybrid_encoder
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256

  # intra-scale attention, on the last level only
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'

  # cross-scale fusion
  use_hybrid: True
  act: 'silu'

# DeFE (density-focused encoder) with MWAS (masked window attention), the Dome additions
DomeHybridEncoder:
  <<: *hybrid_encoder
  defe_type: 'light'
  use_mwas: True
  mwas_window_size: 10

# DFINETransformer is the D-FINE decoder (fixed top-k queries); DomeTransformer merges its settings
# and replaces the query selection with PAQI. A model config picks one with `DOME: {decoder: ...}`.
DFINETransformer: &dfine_transformer
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  hidden_dim: 256
  num_levels: 4
  num_points: [4, 4, 4, 4]

  num_layers: 6
  eval_idx: -1  # -1 scores the last decoder layer; -2 / -3 evaluate earlier ones

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  # D-FINE fine-grained distribution refinement
  reg_max: 32
  reg_scale: 4

  # dimension scaling of the auxiliary decoder layers (with num_layers 6 and eval_idx -4,
  # layers 3, 4 and 5 are auxiliary)
  layer_scale: 1

  cross_attn_method: default  # default, discrete
  query_select_method: default  # default, agnostic

DomeCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_obj: 1}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  defe_density_map_weight: 1

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

DomeTransformer:
  <<: *dfine_transformer
