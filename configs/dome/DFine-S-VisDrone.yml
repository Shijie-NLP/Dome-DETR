# D-FINE-S baseline on VisDrone2019-DET: the plain HybridEncoder (no DeFE, no MWAS) and the D-FINE
# decoder (a fixed num_queries per image instead of PAQI) at the S scale, on the shared 160-epoch
# recipe. 500 queries: the evaluator keeps 500 detections per image.

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
  './include/scale_s.yml',
  './include/recipe_160.yml',
]

output_dir: ./outputs/dfine_s_visdrone

DOME:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 500
