# D-FINE-S baseline on VisDrone2019-DET: the Dome-S recipe on the plain HybridEncoder (no DeFE, no
# MWAS) and the D-FINE decoder (a fixed num_queries per image instead of PAQI), everything else
# unchanged (four-level pyramid, 800 px pipeline, schedule).

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
]

output_dir: ./outputs/dfine_s_visdrone

DOME:
  encoder: HybridEncoder
  decoder: DFINETransformer

HGNetv2:
  name: 'B0'
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [64, 256, 512, 1024]
  depth_mult: .34
  expansion: 0.5

DFINETransformer:
  num_layers: 3
  num_queries: 500


optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065

lr_scheduler:
  type: MultiStepLR
  milestones: [80, 120]
  gamma: 0.8


# 160 epochs; augmentation and multi-scale training stop at 108 and the last 52 epochs
# train on clean images
epoches: 160
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 108
  collate_fn:
    stop_epoch: 108
