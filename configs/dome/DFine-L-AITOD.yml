# D-FINE-L baseline on AI-TOD-v2: the plain HybridEncoder and the D-FINE decoder at the L scale
# (include/scale_l.yml) on the shared 160-epoch recipe. 300 queries, D-FINE's fixed top-k; the tiles
# reach 2667 objects and the evaluator keeps 1500 detections per image, which the per-image
# budget of the Ours config is for.

__include__: [
  '../dataset/aitod_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
  './include/scale_l.yml',
  './include/recipe_160.yml',
]

output_dir: ./outputs/dfine_l_aitod

# the test split is 14k tiles scored at up to 1500 detections each, a validation costs a good part
# of an epoch: every 10 epochs until epoch 60, one by one from there
eval_freq: 10
eval_after: 60

DOME:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 300
