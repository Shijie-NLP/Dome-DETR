# D-FINE-L baseline on AI-TOD-v2: the plain HybridEncoder and the D-FINE decoder at the L scale
# (include/scale_l.yml) on the shared 160-epoch recipe. 300 queries, D-FINE's fixed top-k; the tiles
# reach 2667 objects and the evaluator keeps 1500 detections per image, which the per-image
# budget of the Ours config is for.

__include__: [
  '../dataset/aitod_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
  './include/scale_l.yml',
  './include/recipe_160.yml',
]

output_dir: ./outputs/dfine_l_aitod

# the test split is 14k tiles scored at up to 1500 detections each, a validation costs 40% of an
# epoch. Stage 1 is validated from epoch 100 every 4 epochs (103, 107, 111, 115, 119) and not
# before: the legacy runs' stage-1 AP rises monotonically within 0.001, so best_stg1 is the last
# stage-1 epoch whatever the validations before it show; stage 2 (from 120) validates every epoch
eval_freq: 4
eval_after: 100

DOME:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 300
