# D-FINE-S on AI-TOD-v2 with our method switched on: DFine-S-AITOD plus include/ours.yml (the
# tiles are square, so the cell anchors equal the baseline's here; the other four switches act),
# plus the per-image query budget, which AI-TOD needs and VisDrone does not: a tile holds 4
# objects at the median and up to 2667, 93% of the tiles under 100 and 0.8% over 300 that hold
# 15% of the boxes. A fixed top-k either starves the dense tiles or pays for 1500 queries on
# every sparse one.
#
# The budget: a counting head predicts the bucket of the tile's object count (cut at 100, 200,
# 300 and 600; the buckets widen where tiles are rare, 24 training tiles hold over 600) and the
# tile gets the bucket's queries, 300 / 400 / 500 / 800 / 1500: the bucket's upper edge plus
# room for the duplicates and background candidates the matching needs, 1500 capping the last
# (train tiles reach 1729, a handful of test tiles 2667). The budget is read at the 0.9 quantile
# of the predicted distribution, so an unsure head rounds up. In training the ground truth's
# bucket sets the budget and the head trains alongside on loss_count, with logit adjustment
# against the buckets' imbalance and the encoder's soft count as a feature that extrapolates to
# the dense tiles. The batches are grouped by the same buckets, so a batch pads nothing.

__include__: [
  './DFine-S-AITOD.yml',
  './include/ours.yml',
]

output_dir: ./outputs/dfine_s_aitod_ours

DFINETransformer:
  query_budget: bucket
  count_edges: [100, 200, 300, 600]
  count_budgets: [300, 400, 500, 800, 1500]
  count_quantile: 0.9
  count_train_budget: gt

train_dataloader:
  group_by_count: {edges: [100, 200, 300, 600]}
