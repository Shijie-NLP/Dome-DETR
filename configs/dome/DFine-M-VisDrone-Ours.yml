# D-FINE-M on VisDrone2019-DET with our method switched on: DFine-M-VisDrone as it is, plus the
# switches of include/ours.yml (the fine level, the sampling floor, the outcome-scored encoder,
# cell anchors, the null entry). The B2 stem map is 48 channels wide.

__include__: [
  './DFine-M-VisDrone.yml',
  './include/ours.yml',
]

output_dir: ./outputs/dfine_m_visdrone_ours

HybridEncoder:
  fine_in_channels: 48
