# The ablation of MaxIoU-S-VisDrone-Fine's projection: the same fine level, sampled raw. In
# MaxIoU-S-VisDrone-Fine the decoder projects the 64-channel map to hidden_dim with a 1x1
# conv-BN and the cross-attention reads it like any level; here every head samples the raw
# 64-channel map at its points and a per-head linear lifts the weighted sum of its samples to
# the head's width. A linear map commutes with bilinear sampling, so the two read the same
# function class; what differs is the cost: the dense map, its fp32 copy for the sampling and
# the dense gradient buffers of the sampling's backward pass are 64 channels wide rather than
# 256, and the projection runs on the samples alone.

__include__: [
  './MaxIoU-S-VisDrone-Fine.yml',
]

output_dir: ./outputs/maxiou_s_visdrone_fine_samples

MaxIoUTransformer:
  fine_proj_at: samples
