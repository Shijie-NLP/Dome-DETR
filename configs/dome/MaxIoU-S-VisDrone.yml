# MaxIoU-S on VisDrone2019-DET: the D-FINE-S baseline recipe (plain HybridEncoder, no DeFE / MWAS)
# with the ground-truth-forced query selection and no denoising. At training every ground truth
# forces the encoder token whose box matches it best into the queries and the rest are the tokens
# the objectness passes; at inference the objectness alone selects. Everything past the selection
# is D-FINE's (Hungarian matching), except that the encoder's class logits are trained as plain
# 0/1 objectness (enc_losses) so that logit 0 is the selection rule.

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
]

output_dir: ./outputs/maxiou_s_visdrone

DOME:
  encoder: HybridEncoder
  decoder: MaxIoUTransformer

HGNetv2:
  name: 'B0'
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [64, 256, 512, 1024]
  depth_mult: .34
  expansion: 0.5

MaxIoUTransformer:
  num_layers: 3
  # deformable cross-attention sampling points per level (strides 4, 8, 16, 32), 16 in all as with
  # [4, 4, 4, 4]: the tiny objects live on the fine levels, so those get the points
  num_points: [6, 4, 3, 3]
  num_queries: 2000    # the most queries an image gets (memory guard, training and inference)
  num_denoising: 0   # the ground truths' claimed tokens replace the denoising queries
  # the encoder's class logits are trained on 0/1 targets (class-balanced BCE, the claimed token's
  # class positive); their maximum is the objectness that picks the queries in training and
  # inference alike at its decision boundary, logit 0
  min_queries: 300     # the least queries per image, training (forced tokens included) and inference
  infer_rule: objectness   # or topk, the plain D-FINE selection
  # query self-attention: each query sees its local_attn_k nearest queries (0: all); or keep full
  # attention and rescale the logits by log(n)/log(num_queries) so the entropy does not grow with n
  local_attn_k: 64
  attn_logn_scale: False
  # the deformable cross-attention samples within a radius proportional to the query's box; floor
  # it at so many cells on every level (1: the neighbouring cells) so tiny boxes still read their
  # surroundings (0: off)
  min_sample_cells: 1
  # the FDR layers move the box edges within a range proportional to the first layer's box; let
  # every edge move at least so many cells of the finest level whatever the box size (0: off)
  min_refine_cells: 2
  # the first level's anchor box as a fraction of the image, doubling per level: 0.025 is 5 cells of
  # the stride-4 level (20 px at 800), D-FINE's ratio; its 0.05 default was meant for a stride-8 level
  anchor_grid_size: 0.025
  # how a ground truth ranks the tokens' boxes: gaussian (the same Gaussian similarity as the
  # criterion's quality: scale-invariant, and a small box that just misses a tiny ground truth still
  # beats a coarse-level box that merely contains it, which under giou or iou always wins because
  # any non-overlapping box scores at most 0), nwd (the AI-TOD line's metric), giou or iou
  assign_metric: gaussian
  assign_candidates: 8   # candidates per ground truth: its fallbacks when another took its best token
  assign_radius: 1       # candidates: the 3x3 cells around the ground truth's centre, per level

DomeCriterion:
  enc_losses: ['obj', 'boxes']   # the encoder's queries: plain 0/1 objectness (no IoU target) and boxes
  # the VFL target of the decoder's queries: the boxes' Gaussian similarity (1 - Hellinger distance),
  # parameter-free and about three times less sensitive to a pixel of offset on a tiny box than
  # IoU, whose target jumps with the box head's normal jitter; iou (D-FINE), giou or nwd to ablate
  quality: gaussian


optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065

lr_scheduler:
  type: MultiStepLR
  milestones: [80, 120]
  gamma: 0.8


# 160 epochs; augmentation and multi-scale training stop at 108 and the last 52 epochs
# train on clean images
epoches: 160
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 108
  collate_fn:
    stop_epoch: 108
