# MaxIoU-S on VisDrone2019-DET: the D-FINE-S baseline recipe (plain HybridEncoder, no DeFE / MWAS,
# the 800 px pipeline and schedule of DFine-S-VisDrone) with the ground-truth-forced query
# selection and no denoising.
#
# Training: every ground truth forces the assign_k encoder tokens whose predicted boxes match it
# best into the queries; the other queries are the tokens whose objectness passes obj_threshold,
# filled up to min_queries with the best unpassed tokens. Inference: the objectness alone selects.
# Everything past the selection is D-FINE's (Hungarian matching, VFL with IoU targets, FDR),
# except that the matching cost's localization term is the Gaussian similarity rather than GIoU.
# The encoder's class logits are trained as objectness with a class-balanced BCE: each ground
# truth's enc_topk most similar queries are its positives, targeted at their Gaussian similarity
# (a gradient even when a tiny box does not overlap), everything else at 0, the positive half
# weighing a quarter of the negative half, and logit 0 (obj_threshold 0.5) is the selection rule.

__include__: [
  '../dataset/visdrone_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
]

output_dir: ./outputs/maxiou_s_visdrone

DOME:
  encoder: HybridEncoder
  decoder: MaxIoUTransformer

HGNetv2:
  name: 'B0'
  return_idx: [0, 1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [64, 256, 512, 1024]
  depth_mult: .34
  expansion: 0.5

MaxIoUTransformer:
  num_layers: 3
  # deformable cross-attention sampling points per level (strides 4, 8, 16, 32), 16 in all as with
  # [4, 4, 4, 4]: the tiny objects live on the fine levels, so those get the points
  num_points: [6, 4, 3, 3]
  num_denoising: 0     # the forced tokens take the denoising queries' role

  # the query selection: a token passes when the sigmoid of its highest class logit exceeds
  # obj_threshold; 0.5 is the head's decision boundary, logit 0, and with the balanced loss below
  # the score is not a calibrated probability, so the count is steered by enc_obj_pos_weight, not
  # here. VisDrone crops hold 40 to 100 boxes on most images and up to ~500 on the crowded ones
  obj_threshold: 0.5
  min_queries: 300     # the least queries per image, training and inference alike
  num_queries: 2000    # the most (memory guard); forced tokens are kept beyond it

  # the forced tokens: every ground truth's assign_k most similar tokens, by the Gaussian
  # similarity of their predicted boxes (scale-invariant: a small box that just misses a tiny
  # ground truth still beats a coarse-level box that merely contains it, which under iou or giou
  # always wins), among the 3x3 cells around its centre cell on every level (assign_radius 1).
  # A token several ground truths want is forced once; the criterion decides who predicts what.
  # One per ground truth: every extra forced token is a near-duplicate the loss labels negative
  assign_metric: gaussian
  assign_k: 3
  assign_radius: 1

  # query self-attention restricted to each query's local_attn_k nearest queries by initial box
  # centre (0: all); the compute is the same, only the neighbourhood changes
  local_attn_k: 64
  # the deformable cross-attention samples within a radius proportional to the query's box,
  # floored at one cell on every level so a tiny box still reads its surroundings
  min_sample_cells: 1
  # the first level's anchor box as a fraction of the image, doubling per level: 5 cells of the
  # stride-4 level, D-FINE's ratio (its 0.05 default was meant for a stride-8 first level)
  anchor_grid_size: 0.025
  # min_refine_cells (FDR's edge range floored at so many finest-level cells) stays 0: at 2 it
  # floors the finest bin at 2 px, which cost the tiniest boxes their AP75

DomeCriterion:
  # the encoder set (the selected queries' encoder predictions): objectness and boxes on the
  # topk matching, every ground truth's enc_topk most similar queries by Gaussian similarity
  # (nearly always its forced tokens), a query wanted by several going to the most similar.
  # These matches stay out of the union matching, which with topk > 1 would make the decoder's
  # box losses one-to-many too
  enc_losses: ['obj', 'boxes']
  enc_matching: topk
  enc_topk: 3
  enc_in_uni_set: False
  # the objectness loss: a class-balanced BCE, the positive and negative halves normalized to
  # weight 1/2 each, the positives' shares in proportion to their quality, and the positive half
  # then scaled by enc_obj_pos_weight. At 1 the boundary sits at a likelihood ratio of 1 and passed
  # some 2000 tokens per image; at 0.25 (0.2 : 0.8) a token passes when it looks four times more
  # like an object than like background. A plain BCE (enc_obj_loss: plain) let nothing through: the
  # near-duplicate tokens around each positive are labelled 0 and pull it under the line
  enc_obj_loss: balanced
  enc_obj_pos_weight: 0.20
  enc_obj_quality_weight: False
  # each positive is targeted at its pair's quality rather than 1, so a token whose box is off
  # its ground truth learns a lower score. The encoder's quality is the Gaussian similarity: a
  # tiny box one width off, IoU 0 like the background, still scores 0.4 there, so the score keeps
  # a gradient towards the object where IoU or GIoU (clamped at 0) would have none
  enc_obj_target: quality
  enc_quality: gaussian
  # the decoder's pair quality (VFL target, FGL weight) is IoU as in D-FINE: its score has to
  # rank tight boxes first (the Gaussian similarity there cost 2 points of AP75). The matching
  # cost keeps the Gaussian term instead of GIoU, which saturates once a candidate misses a tiny
  # ground truth (and the normalized L1 is negligible there), so the class cost alone would decide
  dec_quality: iou


optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065

lr_scheduler:
  type: MultiStepLR
  milestones: [80, 120]
  gamma: 0.8


# 160 epochs; augmentation and multi-scale training stop at 150 and the last 10 epochs
# train on clean images
epoches: 160
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 150
  collate_fn:
    stop_epoch: 150
