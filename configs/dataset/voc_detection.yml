task: detection

# PASCAL VOC 2012 detection, read from https://huggingface.co/datasets/shijli/voc2012
# ('difficult' objects are ignore boxes: not trained on, not scored)

evaluator:
  type: VOCEvaluator
  iou_types: ['bbox', ]

num_classes: 20

eval_spatial_size: [640, 640] # h w

train_dataloader:
  type: DataLoader
  dataset:
    type: VOCDetection
    split: train
    transforms:
      type: Compose
      ops:
        - {type: Mosaic, size: [640, 640], p: 1.0}
        - {type: MixUp, alpha: 1.5, p: 0.2}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 72 # epoch in [71, ~) stop `ops`
        ops: ['Mosaic', 'MixUp', 'RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: 2
    stop_epoch: 72 # epoch in [72, ~) stop `multiscales`
  shuffle: True
  num_workers: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: VOCDetection
    split: validation
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
  shuffle: False
  num_workers: 4
