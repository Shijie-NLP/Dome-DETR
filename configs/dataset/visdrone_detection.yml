task: detection

# VisDrone2019-DET, read from https://huggingface.co/datasets/shijli/visdrone2019-det
# (official annotations; 'others' dropped, 'ignored regions' kept as ignore boxes)
#
# Images are resized with their aspect ratio kept. Training resizes the short side to 800 and takes
# a random 800x800 crop; validation uses the mmdetection-style 1333x800 (short side 800, long side
# capped at 1333) on the whole image. RandomIoUCrop zooms in on a 30% to 100% region, which is the
# augmentation the tiny objects profit from; no zoom-out, mosaic or mix-up, which shrink them
# further (the short side of 800 already halves them). Oblique footage: only horizontal flips.

evaluator:
  type: VisDroneEvaluator
  iou_types: ['bbox', ]
  ignore_iof_threshold: 0.5

num_classes: 12  # labels are the official VisDrone ids 1..10; 0 and 11 are never predicted

train_dataloader:
  type: DataLoader
  dataset:
    type: VisDroneDetection
    split: train
    transforms:
      type: Compose
      ops:
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: 800}  # short side 800, aspect ratio kept
        - {type: RandomCrop, size: [800, 800]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        # after the crop, still on the PIL image: a pixel-wise colour change commutes with the
        # crops and the resize, and PIL does it in 30 ms on 800x800 against 70 ms on the full-size
        # image (torchvision's tensor version takes 50 ms on the single thread a worker has)
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        # from this epoch on the listed augmentations are switched off
        name: stop_epoch
        epoch: 72
        ops: ['RandomPhotometricDistort', 'RandomIoUCrop']
  shuffle: True
  num_workers: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: VisDroneDetection
    split: validation
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: 800, max_size: 1333}  # 1333x800: short side 800, long side at most 1333
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 4
