task: detection

# AI-TOD-v2, read from https://huggingface.co/datasets/shijli/aitod-v2
# (official v2 annotations; the AI-TOD protocol trains on train + validation and reports on test)
#
# The tiles are 800x800 already and stay so: the resize only acts on the zoomed-in crops of
# RandomIoUCrop (a 30% to 100% region scaled up to 800x800: the augmentation the tiny objects
# profit from), as in the original recipe.
# No zoom-out, mosaic or mix-up, which shrink them. Orthogonal aerial imagery: every orientation
# is as natural as any other, so both flips and the 90-degree rotations are free data.

evaluator:
  type: AITODEvaluator
  iou_types: ['bbox', ]

num_classes: 8  # labels are the official AI-TOD-v2 ids 0..7

train_dataloader:
  type: DataLoader
  dataset:
    type: AITODDetection
    split: train+validation
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: RandomVerticalFlip}
        - {type: RandomRotate90}  # 0, 90, 180 or 270 degrees, equally likely
        - {type: Resize, size: [800, 800]}  # the tiles' own size; a zoomed-in crop is scaled up to it
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        # from this epoch on the listed augmentations are switched off (the flips and rotations stay)
        name: stop_epoch
        epoch: 72
        ops: ['RandomPhotometricDistort', 'RandomIoUCrop']
  shuffle: True
  num_workers: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: AITODDetection
    split: test
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [800, 800]}  # the tiles' own size
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 4
