# Runtime defaults shared by every experiment. Model configs and the command line override them.

print_freq: 100
# every run writes into its own <output_dir>/<date>_<time> (a resumed run into its checkpoint's
# directory); `--output-dir` on the command line names the directory itself
output_dir: './logs'
checkpoint_freq: 12
# stage 1 is validated from epoch eval_after on, every eval_freq epochs (counted from epoch 0),
# and on its last epoch whatever the two say; stage 2 validates every epoch, its patience counts
# them
eval_freq: 1
eval_after: 0


sync_bn: True
find_unused_parameters: False


# mixed precision and EMA are off here and switched on by dome/include/optimizer.yml
use_amp: False
scaler:
  type: GradScaler
  enabled: True

use_ema: False
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
# decay the EMA restarts with when stage 2 reloads the best stage-1 checkpoint
ema_restart_decay: 0.9999
