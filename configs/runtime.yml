# Runtime defaults shared by every experiment. Model configs and the command line override them.

print_freq: 100
output_dir: './logs'
checkpoint_freq: 12


sync_bn: True
find_unused_parameters: False


# mixed precision and EMA are off here and switched on by dome/include/optimizer.yml
use_amp: False
scaler:
  type: GradScaler
  enabled: True

use_ema: False
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 1000
